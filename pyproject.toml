[project]
name = "simple-web-scraper"
version = "0.4.1"
description = "Lightweight resident that spawns a heavy browser worker on demand to scrape pages"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7",
    "filelock>=3.13",
    "patchright==1.64.4",
    "curl_cffi>=0.7",
    "trafilatura>=1.12",
]

[project.scripts]
simple-web-scraper = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: integration tests that launch a real browser / spawn a real worker",
]
addopts = "-m 'not live'"
